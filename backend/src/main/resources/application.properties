spring.application.name=demo

# La autenticacion de esta app es 100% custom (JwtService + JwtAuthenticationFilter
# pueblan el SecurityContext directamente a partir del JWT, sin pasar nunca por
# AuthenticationManager/AuthenticationProvider). No existe ningun bean UserDetailsService
# a proposito. Sin esta exclusion, UserDetailsServiceAutoConfiguration genera un
# usuario en memoria con password aleatoria en cada arranque (el warning "Using
# generated security password"), que no se usa en ningun lado de este flujo.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# PostgreSQL 16 (ver docker-compose.yml para levantar la instancia local de desarrollo).
# Puerto 5433 en el host: el 5432 ya esta ocupado por un PostgreSQL 15 nativo de Windows.
spring.datasource.url=jdbc:postgresql://localhost:5433/umlapp
spring.datasource.username=umlapp
spring.datasource.password=umlapp_dev_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Fase temprana sin Flyway/Liquibase: Hibernate mantiene el esquema sincronizado
# con las entidades. Reemplazar por migraciones versionadas (Flyway) antes de produccion.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
